<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة نتائج الطالب - ثانوية الأمير عبدالمجيد 😉</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f8fafc; --accent: #0284c7; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: auto; }
        
        /* شاشة البحث */
        .search-card { background: white; padding: 30px; border-radius: 20px; max-width: 450px; margin: 40px auto; text-align: center; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .search-card input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; text-align: center; font-size: 1rem; }
        .search-card button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        
        /* اللوحة الخاصة بالطالب */
        .dashboard { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-bottom: 4px solid var(--accent); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .stat-card p { font-size: 1.5rem; font-weight: bold; color: var(--accent); margin: 5px 0 0; }
        
        .chart-box { background: white; padding: 20px; border-radius: 15px; border: 1px solid var(--border); height: 300px; margin-bottom: 20px; }
        .table-box { background: white; border-radius: 15px; overflow-x: auto; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        
        .btn-review { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #review-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .ans-card { padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem; }
        .correct { background: #dcfce7; color: #166534; }
        .wrong { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <!-- البحث -->
    <div class="search-card" id="searchSection">
        <h2 style="color: var(--accent); margin-top: 0;">📊 بوابة نتائج الطالب</h2>
        <p style="color: #64748b;">أدخل اسمك أو إيميل منصة مدرستي</p>
        <input type="text" id="searchInput" placeholder="Sxxxxxxx@rb.moe.gov.sa أو اسم الطالب">
        <button id="btnSearch" onclick="fetchData()">عرض النتائج</button>
        <div id="errMsg" style="color: #dc2626; margin-top: 10px; font-size: 0.85rem; display: none;"></div>
    </div>

    <!-- نتائج الطالب -->
    <div class="dashboard" id="dashboardSection">
        <div class="header">
            <div>
                <h2 id="stName" style="margin: 0; color: var(--accent);">مرحباً</h2>
                <span style="font-size: 0.85rem; color: #64748b;">ثانوية الأمير عبدالمجيد 😉</span>
            </div>
            <button onclick="location.reload()" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer;">بحث جديد 🔍</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><h3>المختبرات المكتملة</h3><p id="stCount">0</p></div>
            <div class="stat-card"><h3>المتوسط العام</h3><p id="stAvg">0%</p></div>
            <div class="stat-card"><h3>أعلى نتيجة</h3><p id="stMax">0%</p></div>
        </div>

        <div class="chart-box">
            <canvas id="stChart"></canvas>
        </div>

        <h3>📋 سجل الاختبارات والتغذية الراجعة:</h3>
        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>النموذج</th>
                        <th style="text-align:center;">التاريخ</th>
                        <th style="text-align:center;">الدرجة</th>
                        <th style="text-align:center;">التغذية الراجعة</th>
                    </tr>
                </thead>
                <tbody id="stRows"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- نافذة المراجعة -->
<div id="review-modal">
    <div class="modal-content">
        <h3 id="revTitle">مراجعة الإجابات</h3>
        <div id="revBody"></div>
        <button onclick="document.getElementById('review-modal').style.display='none'" style="margin-top: 15px; padding: 8px 15px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer;">إغلاق</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let studentData = [];
    let myChart = null;

    async function fetchData() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const err = document.getElementById('errMsg');
        const btn = document.getElementById('btnSearch');
        err.style.display = 'none';

        if (!query) {
            err.innerText = "يرجى كتابة الاسم أو الإيميل أولاً.";
            err.style.display = 'block';
            return;
        }

        btn.innerText = "جاري البحث...";
        btn.disabled = true;

        // استخراج أرقام من الإيميل مثل S5649427 -> 5649427
        const numMatch = query.match(/\d+/);
        const idNum = numMatch ? numMatch[0] : "";

        try {
            const snap = await db.collection("alkfaeat_results").get();
            studentData = [];

            snap.forEach(doc => {
                const d = doc.data();
                const name = String(d.name || "").toLowerCase();
                const email = String(d.email || "").toLowerCase();

                // التحقق من الاسم أو الإيميل أو الرقم المدمج
                if (name.includes(query) || email.includes(query) || (idNum && (name.includes(idNum) || email.includes(idNum)))) {
                    studentData.push(d);
                }
            });

            if (studentData.length === 0) {
                err.innerText = "لم نتمكن من العثور على أي نتائج. **جرب كتابة اسم الطالب ثلاثياً أو رباعياً** كما هو في لوحة التحكم.";
                err.style.display = 'block';
                btn.innerText = "عرض النتائج";
                btn.disabled = false;
                return;
            }

            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';

            renderUI();

        } catch (e) {
            console.error(e);
            err.innerText = "خطأ في الاتصال بالسحابة: " + e.message;
            err.style.display = 'block';
        } finally {
            btn.innerText = "عرض النتائج";
            btn.disabled = false;
        }
    }

    function renderUI() {
        let lastObj = studentData[studentData.length - 1];
        document.getElementById('stName').innerText = "👤 مرحباً بك: " + (lastObj.name || "الطالب");

        document.getElementById('stCount').innerText = studentData.length;
        
        let pcts = studentData.map(d => Math.round((d.score / d.total) * 100));
        let avg = Math.round(pcts.reduce((a,b)=>a+b,0) / pcts.length);
        document.getElementById('stAvg').innerText = avg + "%";
        document.getElementById('stMax').innerText = Math.max(...pcts) + "%";

        let rows = "";
        let labels = [];

        studentData.forEach((d, idx) => {
            let mName = d.model_id || "الكفايات اللغوية";
            let p = Math.round((d.score / d.total) * 100);
            labels.push(mName);

            rows += `<tr>
                <td><b>${mName}</b></td>
                <td style="text-align:center;">${d.time ? new Date(d.time.toDate ? d.time.toDate() : d.time).toLocaleDateString('ar-SA') : '-'}</td>
                <td style="text-align:center; color:var(--accent); font-weight:bold;">${d.score}/${d.total} (${p}%)</td>
                <td style="text-align:center;"><button class="btn-review" onclick="showReview(${idx})">👁️ مراجعة</button></td>
            </tr>`;
        });

        document.getElementById('stRows').innerHTML = rows;

        // الرسم البياني
        const ctx = document.getElementById('stChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: labels.length === 1 ? 'bar' : 'line',
            data: {
                labels: labels,
                datasets: [{ label: 'النسبة %', data: pcts, borderColor: '#0284c7', backgroundColor: 'rgba(2,132,199,0.2)', fill: true }]
            },
            options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
        });
    }

    function showReview(idx) {
        let d = studentData[idx];
        document.getElementById('revTitle').innerText = "👁️ مراجعة: " + (d.model_id || "الاختبار");
        let html = "";

        if (d.answers && d.answers.length > 0) {
            d.answers.forEach((ans, i) => {
                html += `<div class="ans-card ${ans.isCorrect ? 'correct' : 'wrong'}">
                    <b>س ${i+1}: ${ans.qText || 'السؤال'}</b><br>
                    إجابتك: ${ans.studentAns} ${ans.isCorrect ? '✅' : '❌'}<br>
                    ${!ans.isCorrect ? `<span>الإجابة الصحيحة: ${ans.correctAns}</span>` : ''}
                </div>`;
            });
        } else {
            html = "<p style='text-align:center;'>لا توجد تفاصيل تفاعلية مسجلة لهذا الاختبار.</p>";
        }

        document.getElementById('revBody').innerHTML = html;
        document.getElementById('review-modal').style.display = 'flex';
    }
</script>
</body>
</html>
