<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة نتائج الطالب - ثانوية الأمير عبدالمجيد 😉</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --correct-bg: #dcfce7; --correct-text: #166534;
            --wrong-bg: #fee2e2; --wrong-text: #991b1b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        /* شاشة البحث بالبريد فقط */
        .search-card {
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            max-width: 450px;
            margin: 40px auto;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        .search-card h2 { color: var(--accent); margin-top: 0; margin-bottom: 10px; }
        .search-card p { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px; }

        .search-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1rem;
            outline: none;
            direction: ltr;
        }
        .search-card input:focus { border-color: var(--accent); }

        .btn-search {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-search:hover { background: #0369a1; }

        /* منطقة النتائج واللوحة الخاصة بالطالب */
        .dashboard { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--accent);
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        .header h2 { margin: 0; color: var(--accent); font-size: 1.4rem; }
        .btn-reset {
            background: #f1f5f9;
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-card h3 { margin: 0; font-size: 0.85rem; color: var(--text-sub); }
        .stat-card p { font-size: 1.5rem; font-weight: bold; color: var(--accent); margin: 5px 0 0; }

        .chart-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            height: 300px;
            margin-bottom: 20px;
        }

        .table-box {
            background: white;
            border-radius: 15px;
            overflow-x: auto;
            border: 1px solid var(--border);
        }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #f8fafc; padding: 12px; color: var(--text-sub); border-bottom: 2px solid var(--border); font-size: 0.85rem; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        .btn-review {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-review:hover { background: #16a34a; color: white; }

        /* نافذة المراجعة والتغذية الراجعة */
        #review-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 650px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: right;
        }
        .ans-card {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            line-height: 1.6;
            font-size: 0.9rem;
        }
        .ans-card.correct { background: var(--correct-bg); color: var(--correct-text); border-color: #bbf7d0; }
        .ans-card.wrong { background: var(--wrong-bg); color: var(--wrong-text); border-color: #fecaca; }
        .close-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة إدخال البريد الإلكتروني -->
    <div class="search-card" id="searchSection">
        <h2>🔒 بوابة نتائج الطالب</h2>
        <p>أدخل البريد الإلكتروني (إيميل منصة مدرستي) الخـاص بك للوصول لنتائجك</p>
        <input type="email" id="searchInput" placeholder="s5807776@rb.moe.gov.sa" autocomplete="off" dir="ltr">
        <button class="btn-search" id="btnSearch" onclick="fetchData()">عرض النتائج</button>
        <div id="errMsg" style="color: #dc2626; margin-top: 12px; font-size: 0.88rem; display: none; background: #fee2e2; padding: 10px; border-radius: 8px;"></div>
    </div>

    <!-- لوحة نتائج الطالب المخصصة -->
    <div class="dashboard" id="dashboardSection">
        <div class="header">
            <div>
                <h2 id="stName">مرحباً بك</h2>
                <span style="font-size: 0.85rem; color: var(--text-sub);" id="stEmail"></span>
            </div>
            <button class="btn-reset" onclick="location.reload()">تسجيل خروج / إيميل آخر 🔒</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><h3>عدد الاختبارات</h3><p id="stCount">0</p></div>
            <div class="stat-card"><h3>المتوسط العام</h3><p id="stAvg">0%</p></div>
            <div class="stat-card"><h3>أعلى نتيجة</h3><p id="stMax">0%</p></div>
        </div>

        <div class="chart-box">
            <canvas id="stChart"></canvas>
        </div>

        <h3 style="margin-bottom: 12px; color: var(--text-main);">📋 سجل اختباراتك والتغذية الراجعة:</h3>
        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>اسم النموذج / الاختبار</th>
                        <th style="text-align:center;">التاريخ والتوقيت</th>
                        <th style="text-align:center;">الدرجة والنسبة</th>
                        <th style="text-align:center;">التغذية الراجعة</th>
                    </tr>
                </thead>
                <tbody id="stRows"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- نافذة المراجعة -->
<div id="review-modal">
    <div class="modal-content">
        <h3 id="revTitle" style="margin-top:0; color:var(--accent);">👁️ مراجعة إجابات الاختبار</h3>
        <div id="revBody"></div>
        <button class="close-btn" onclick="document.getElementById('review-modal').style.display='none'">إغلاق التقرير</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let studentData = [];
    let myChart = null;

    async function fetchData() {
        const rawInput = document.getElementById('searchInput').value.trim().toLowerCase();
        const err = document.getElementById('errMsg');
        const btn = document.getElementById('btnSearch');
        err.style.display = 'none';

        if (!rawInput) {
            err.innerText = "يرجى كتابة البريد الإلكتروني الخاص بك أولاً.";
            err.style.display = 'block';
            return;
        }

        // استخراج أرقام من البريد الإلكتروني المدخل (مثل s5807776 -> 5807776)
        const idMatch = rawInput.match(/\d+/);
        const studentNumber = idMatch ? idMatch[0] : "";

        btn.innerText = "جاري جلب النتائج...";
        btn.disabled = true;

        try {
            const snap = await db.collection("alkfaeat_results").get();
            studentData = [];

            snap.forEach(doc => {
                const d = doc.data();
                const docEmail = String(d.email || "").toLowerCase().trim();
                const docName = String(d.name || "").toLowerCase().trim();

                // 🛑 شروط المطابقة الذكية بالبريد والرقم:
                // 1. تطابق الإيميل كاملاً بغض النظر عن الكابيتال والسمول
                // 2. تطابق رقم الطالب المدخل مع الإيميل المخزن
                // 3. احتواء حقل الإيميل المخزن على اسم المستخدم
                const isEmailMatch = docEmail && (docEmail === rawInput || docEmail.includes(rawInput) || rawInput.includes(docEmail));
                const isNumberMatch = studentNumber && (docEmail.includes(studentNumber) || docName.includes(studentNumber));

                if (isEmailMatch || isNumberMatch) {
                    studentData.push(d);
                }
            });

            // ترتيب الاختبارات زمنياً
            studentData.sort((a, b) => {
                let tA = a.time ? (a.time.toDate ? a.time.toDate() : new Date(a.time)) : 0;
                let tB = b.time ? (b.time.toDate ? b.time.toDate() : new Date(b.time)) : 0;
                return tA - tB;
            });

            if (studentData.length === 0) {
                err.innerText = "لم نتمكن من العثور على أي نتائج مسجلة بهذا البريد الإلكتروني. يرجى التأكد من كتابة الإيميل كما هو مُدخل أثناء حل الاختبار.";
                err.style.display = 'block';
                btn.innerText = "عرض النتائج";
                btn.disabled = false;
                return;
            }

            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';

            renderUI(rawInput);

        } catch (e) {
            console.error(e);
            err.innerText = "خطأ في الاتصال بالسحابة: " + e.message;
            err.style.display = 'block';
        } finally {
            btn.innerText = "عرض النتائج";
            btn.disabled = false;
        }
    }

    function renderUI(email) {
        let lastObj = studentData[studentData.length - 1];
        document.getElementById('stName').innerText = "👤 مرحباً بك: " + (lastObj.name || "الطالب");
        document.getElementById('stEmail').innerText = email;

        document.getElementById('stCount').innerText = studentData.length;
        
        let pcts = studentData.map(d => Math.round((d.score / d.total) * 100));
        let avg = Math.round(pcts.reduce((a,b)=>a+b,0) / pcts.length);
        document.getElementById('stAvg').innerText = avg + "%";
        document.getElementById('stMax').innerText = Math.max(...pcts) + "%";

        let rows = "";
        let labels = [];

        studentData.forEach((d, idx) => {
            let mName = d.model_id || "الكفايات اللغوية";
            let p = Math.round((d.score / d.total) * 100);
            labels.push(mName);

            let dateText = "-";
            if (d.time) {
                let dateObj = d.time.toDate ? d.time.toDate() : new Date(d.time);
                dateText = dateObj.toLocaleDateString('ar-SA', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            rows += `<tr>
                <td><b>${mName}</b></td>
                <td style="text-align:center; color:var(--text-sub); font-size:0.85rem;">${dateText}</td>
                <td style="text-align:center; color:var(--accent); font-weight:bold;">${d.score} من ${d.total} (${p}%)</td>
                <td style="text-align:center;"><button class="btn-review" onclick="showReview(${idx})">👁️ مراجعة الإجابات</button></td>
            </tr>`;
        });

        document.getElementById('stRows').innerHTML = rows;

        // رسم بياني لتقدم أداء الطالب
        const ctx = document.getElementById('stChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: labels.length === 1 ? 'bar' : 'line',
            data: {
                labels: labels,
                datasets: [{ 
                    label: 'النسبة %', 
                    data: pcts, 
                    borderColor: '#0284c7', 
                    backgroundColor: labels.length === 1 ? '#0284c7' : 'rgba(2,132,199,0.15)', 
                    fill: true,
                    tension: 0.3,
                    pointRadius: 6,
                    pointBackgroundColor: '#0284c7'
                }]
            },
            options: { 
                responsive: true,
                maintainAspectRatio: false, 
                scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } },
                plugins: { legend: { display: false } }
            }
        });
    }

    function showReview(idx) {
        let d = studentData[idx];
        document.getElementById('revTitle').innerText = "👁️ التغذية الراجعة: نموذج (" + (d.model_id || "الاختبار") + ")";
        let html = "";

        if (d.answers && d.answers.length > 0) {
            d.answers.forEach((ans, i) => {
                html += `<div class="ans-card ${ans.isCorrect ? 'correct' : 'wrong'}">
                    <b>السؤال ${i+1}: ${ans.qText || 'السؤال'}</b><br>
                    <span>إجابتك: <b>${ans.studentAns || 'غير مجاب'}</b> ${ans.isCorrect ? '✅ (صح)' : '❌ (خطأ)'}</span><br>
                    ${!ans.isCorrect ? `<span style="font-weight:bold; color:#166534;">الإجابة الصحيحة: ${ans.correctAns}</span>` : ''}
                </div>`;
            });
        } else {
            html = "<p style='text-align:center; padding:20px; color:var(--text-sub);'>لا توجد تفاصيل تفاعلية مسجلة لهذا الاختبار.</p>";
        }

        document.getElementById('revBody').innerHTML = html;
        document.getElementById('review-modal').style.display = 'flex';
    }
</script>
</body>
</html>
